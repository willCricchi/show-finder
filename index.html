<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Show Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: sticky header with search + tabs, one content column; detail view is poster beside facts, stacking on phones. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --sunk: #E8ECF3; --ink: #15203B; --muted: #56617B;
  --line: #D9DFEA; --accent: #C8102E; --accent-ink: #FFFFFF; --ok: #1E7A4C; --ok-bg: #E2F3EA;
  --warn-bg: #FFF4D6; --warn-ink: #7A5200;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --base: 18px; --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1322; --surface: #161F35; --sunk: #1F2A44; --ink: #EEF1F7; --muted: #A4AEC4;
  --line: #2B3654; --accent: #FF5C70; --accent-ink: #1A0006; --ok: #6FD7A1; --ok-bg: #143326;
  --warn-bg: #3A2E0E; --warn-ink: #F7D27A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1322; --surface: #161F35; --sunk: #1F2A44; --ink: #EEF1F7; --muted: #A4AEC4;
  --line: #2B3654; --accent: #FF5C70; --accent-ink: #1A0006; --ok: #6FD7A1; --ok-bg: #143326;
  --warn-bg: #3A2E0E; --warn-ink: #F7D27A; color-scheme: dark; }
:root.big { --base: 21px; }

* { box-sizing: border-box; }
html { font-size: var(--base); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.5; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
.brand .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
form.search { flex: 1 1 320px; display: flex; gap: 8px; min-width: 0; }
form.search input { flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--bg); }
form.search input:focus { border-color: var(--ink); outline: none; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; width: 100%; }
nav.tabs a { text-decoration: none; padding: 10px 14px; border-radius: 999px; font-weight: 700; white-space: nowrap; color: var(--muted); }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a:hover:not([aria-current="page"]) { background: var(--sunk); color: var(--ink); }
.count { display: inline-block; min-width: 1.5em; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 0.75rem; text-align: center; }

main { padding-block: 24px 64px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { font-size: 2rem; }
.sub { color: var(--muted); margin: 4px 0 0; }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.saved { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.btn:hover { filter: brightness(1.1); }
.btn.small { padding: 6px 12px; font-size: 0.85rem; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip small { font-weight: 400; opacity: 0.8; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 18px; align-items: end; }
.filters label, .filters .flabel { display: flex; flex-direction: column; gap: 2px; font-size: 0.8rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
select, .filters input { padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--ink); }
.check { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; text-transform: none !important; letter-spacing: 0 !important; font-size: 1rem !important; color: var(--ink) !important; font-weight: 400 !important; cursor: pointer; }
.check input { width: 20px; height: 20px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 18px; }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; text-decoration: none; min-width: 0; }
.poster { aspect-ratio: 210 / 295; width: 100%; max-width: 100%; border-radius: var(--radius); background: var(--sunk); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-family: var(--display); font-size: 1.1rem; text-align: center; padding: 0; }
.poster img { width: 100%; height: 100%; object-fit: cover; }
.poster .ph { padding: 12px; }
.card:hover .poster img { transform: scale(1.03); }
.poster img { transition: transform .25s; }
.card h3 { font-size: 1.02rem; font-family: var(--body); font-weight: 700; }
.meta { font-size: 0.85rem; color: var(--muted); }
.svc { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--sunk); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svc i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c, var(--muted)); }
.badge { position: absolute; top: 8px; left: 8px; padding: 3px 9px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.save-dot { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--surface); color: var(--ink); font-size: 1.3rem; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgb(0 0 0 / .25); display: grid; place-items: center; }
.save-dot.on { background: var(--ok); color: var(--surface); }

.section-title { font-size: 1.3rem; margin: 30px 0 14px; display: flex; align-items: baseline; gap: 10px; }
.section-title small { font-family: var(--body); font-size: 0.85rem; color: var(--muted); font-weight: 400; }

.empty, .note { padding: 22px; border-radius: var(--radius); background: var(--surface); border: 1px dashed var(--line); color: var(--muted); }
.note { border-style: solid; background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; font-size: 0.92rem; }
.loading { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 30px 0; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .poster img { transition: none; } }

/* Detail */
.back { margin-bottom: 18px; }
.detail { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 32px; align-items: start; }
.detail .poster { box-shadow: 0 10px 30px rgb(0 0 0 / .18); }
.detail h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); margin: 10px 0 16px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
.pill.live { background: var(--ok-bg); color: var(--ok); }
.pill.ended { background: var(--sunk); color: var(--muted); }
.pill.wait { background: var(--warn-bg); color: var(--warn-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
.synopsis { max-width: 65ch; font-size: 1.05rem; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-top: 18px; }
.box h2 { font-size: 1.15rem; margin-bottom: 10px; }
.where-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 0; border-top: 1px solid var(--line); }
.where-row:first-of-type { border-top: none; }
.where-row .name { font-weight: 700; font-size: 1.05rem; }
.price { font-variant-numeric: tabular-nums; font-weight: 700; }
.have { color: var(--ok); font-weight: 700; }
.logos { display: flex; flex-wrap: wrap; gap: 10px; }
.logo { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; background: var(--sunk); font-weight: 700; font-size: 0.9rem; }
.logo img { width: 34px; height: 34px; border-radius: 8px; }
.next { display: flex; gap: 14px; align-items: center; }
.next .when { font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--accent); }
.trailer { margin-top: 14px; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; border-radius: var(--radius); background: #000; overflow: hidden; }
.trailer iframe { width: 100%; height: 100%; border: 0; display: block; }

details.season { border-top: 1px solid var(--line); }
details.season:first-of-type { border-top: none; }
details.season summary { cursor: pointer; padding: 12px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; list-style: none; }
details.season summary::-webkit-details-marker { display: none; }
details.season summary::before { content: "▸"; color: var(--muted); width: 1em; }
details.season[open] summary::before { content: "▾"; }
details.season summary b { font-family: var(--display); font-size: 1.1rem; }
.eps { list-style: none; padding: 0 0 12px; margin: 0; display: grid; gap: 2px; }
.ep { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 4px 12px; padding: 8px 10px; border-radius: 8px; }
.ep:nth-child(odd) { background: var(--bg); }
.ep .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.ep .d { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ep .s { grid-column: 2 / 4; font-size: 0.9rem; color: var(--muted); }
.ep.future .d { color: var(--accent); font-weight: 700; }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.person { display: flex; gap: 10px; align-items: center; min-width: 0; }
.person img, .person .face { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--sunk); flex: none; }
.person div { min-width: 0; font-size: 0.9rem; }
.person small { display: block; color: var(--muted); }

/* Schedule list */
.slist { display: grid; gap: 10px; }
.srow { display: grid; grid-template-columns: 5.5em 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); text-decoration: none; }
.srow:hover { border-color: var(--ink); }
.srow .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.srow .thumb { width: 64px; aspect-ratio: 210/295; border-radius: 8px; overflow: hidden; background: var(--sunk); }
.srow .thumb img { width: 100%; height: 100%; object-fit: cover; }
.srow h3 { font-size: 1.05rem; font-family: var(--body); }

/* Costs */
.cost-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.cost-table td { padding: 10px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
.cost-table tr:first-child td { border-top: none; }
.cost-table .r { text-align: right; white-space: nowrap; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 2px solid var(--ink); margin-top: 6px; }
.total b { font-family: var(--display); font-size: 1.8rem; }
.tip { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-size: 0.95rem; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.owned { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 18px; }
footer { color: var(--muted); font-size: 0.85rem; padding-block: 24px 40px; border-top: 1px solid var(--line); }

/* Multi-select filters */
.ms { position: relative; }
.ms > summary { list-style: none; cursor: pointer; position: relative; padding: 9px 34px 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 1rem; text-transform: none; letter-spacing: 0; font-weight: 400; min-width: 9.5em; max-width: 17em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms > summary::-webkit-details-marker { display: none; }
.ms > summary::after { content: "▾"; position: absolute; right: 12px; color: var(--muted); }
.ms[open] > summary, .ms.on > summary { border-color: var(--ink); }
.ms.on > summary { font-weight: 700; }
.ms-panel { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: max-content; min-width: 100%; max-width: min(92vw, 380px); max-height: 60vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 30px rgb(0 0 0 / .22); padding: 8px; display: grid; gap: 2px; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 1rem; color: var(--ink); }
.filters .ms-row { flex-direction: row; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 400; }
.ms-row:hover, .ms-tri:hover { background: var(--sunk); }
.ms-row input { width: 20px; height: 20px; }
.ms-tri { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 8px; }
.tri { border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--muted); }
.tri.yes[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tri.no[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ms-hint { padding: 4px 8px 8px; font-size: 0.85rem; color: var(--muted); max-width: 32em; }
.ms-foot { position: sticky; bottom: -8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 8px 4px; margin-top: 4px; border-top: 1px solid var(--line); background: var(--surface); }
.linkbtn { background: none; border: none; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; font-weight: 700; font-size: inherit; }

/* Watched */
.watch-btn { margin-top: auto; border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
.watch-btn:hover { border-color: var(--ink); color: var(--ink); }
.watch-btn.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.card.is-watched .poster img { opacity: 0.55; }
.why { font-size: 0.82rem; color: var(--ok); font-weight: 700; }
.head-checks { display: flex; flex-direction: column; gap: 6px; }

/* Quick look */
body:has(dialog[open]) { overflow: hidden; }
dialog.quick { width: min(820px, calc(100vw - 32px)); max-width: none; max-height: calc(100dvh - 32px); padding: 0; border: none; border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px rgb(0 0 0 / .45); overflow: auto; overscroll-behavior: contain; }
dialog.quick::backdrop { background: rgb(8 12 24 / .62); }
.quick-bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px 12px 0; pointer-events: none; }
.quick-bar .btn { background: var(--surface); pointer-events: auto; }
.quick-body { padding: 0 22px 22px; }
.quick-in { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 22px; align-items: start; }
.quick-in .quick-title { font-size: 1.8rem; }
.quick-in .synopsis { font-size: 1rem; }
.quick-in .facts { margin: 8px 0 10px; }

/* Swipe */
.deck { max-width: 440px; margin: 0 auto; }
.swipe-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 14px 40px rgb(0 0 0 / .18); touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .22s ease, opacity .22s ease; cursor: grab; }
.swipe-card.dragging { transition: none; cursor: grabbing; }
.swipe-card .pimg { position: relative; overflow: hidden; height: min(46vh, 420px); background: var(--sunk); display: grid; place-items: center; font-family: var(--display); font-size: 1.4rem; }
.swipe-card .pimg img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: center 20%; pointer-events: none; }
.sinfo { padding: 16px 18px 18px; display: grid; gap: 8px; }
.sinfo h2 { font-size: 1.5rem; }
.sinfo .facts { margin: 0; }
.sclamp { margin: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.stamp { position: absolute; top: 22px; z-index: 2; padding: 4px 14px; border: 4px solid currentColor; border-radius: 10px; font-family: var(--display); font-weight: 800; font-size: 1.4rem; letter-spacing: .06em; opacity: 0; background: var(--surface); pointer-events: none; }
.stamp.yes { left: 18px; color: var(--ok); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--accent); transform: rotate(12deg); }
.swipe-actions { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.sbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 100px; padding: 12px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; font-size: 0.9rem; }
.sbtn b { font-size: 1.6rem; line-height: 1; }
.sbtn.no b { color: var(--accent); }
.sbtn.yes b { color: var(--ok); }
.sbtn.seen b { color: var(--muted); }
.sbtn:hover { border-color: var(--ink); }
.center { text-align: center; justify-content: center; }
details.box > summary { cursor: pointer; font-family: var(--display); font-size: 1.15rem; }
@media (prefers-reduced-motion: reduce) { .swipe-card { transition: none; } }

@media (max-width: 760px) {
  .ms-panel { position: fixed; top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: auto; min-width: 0; max-width: none; max-height: 70vh; }
  header.top { position: static; }
  nav.tabs { flex-wrap: wrap; overflow: visible; gap: 4px 2px; }
  nav.tabs a { padding: 6px 10px; font-size: 0.9rem; }
  .top .wrap { padding-block: 10px; gap: 8px; }
  .swipe-card .pimg { height: 34vh; }
  .sclamp { -webkit-line-clamp: 3; }
  .sbtn { min-width: 0; flex: 1; padding: 10px 8px; }
  .swipe-actions { gap: 8px; flex-wrap: nowrap; margin-top: 14px; }
  .quick-in { grid-template-columns: 1fr; gap: 14px; }
  .quick-in .poster { max-width: 140px; }
  .quick-body { padding: 0 16px 18px; }
  .detail { grid-template-columns: 1fr; gap: 18px; }
  .detail .poster { max-width: 200px; }
  .two { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 12px; }
  .srow { grid-template-columns: 52px minmax(0, 1fr); }
  .srow .t { grid-column: 1 / 3; font-size: 0.9rem; color: var(--muted); }
  .srow .thumb { width: 52px; }
  .srow .svc { grid-column: 2; justify-self: start; }
  .page-head h1 { font-size: 1.6rem; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#tonight"><span class="dot" aria-hidden="true"></span>Show Finder</a>
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search any TV show…" aria-label="Search any TV show" autocomplete="off">
      <button class="btn" type="submit">Search</button>
    </form>
    <nav class="tabs" aria-label="Sections">
      <a href="#tonight" data-tab="tonight">New episodes</a>
      <a href="#browse" data-tab="browse">Browse all shows</a>
      <a href="#foryou" data-tab="foryou">For you</a>
      <a href="#swipe" data-tab="swipe">Swipe</a>
      <a href="#mylist" data-tab="mylist">My shows <span class="count" id="listCount">0</span></a>
      <a href="#settings" data-tab="settings">Settings</a>
    </nav>
  </div>

const memo = new Map();
function getJSON(url, opts) {
  if (memo.has(url)) return memo.get(url);
  const p = (async () => {
    for (let i = 0; i < 4; i++) {
      const r = await fetch(url, opts);
      if (r.status === 429) { await sleep(1500 * (i + 1)); continue; }
      if (r.status === 404) return null;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }
    throw new Error("The show database is busy. Try again in a few seconds.");
  })();
  memo.set(url, p);
  p.catch(() => memo.delete(url));
  return p;
}

}
async function tmdbIdFor(show) {

}

const SVC = Object.fromEntries(SERVICES.map(s => [s.id, s]));

function platformOf(show) {
  const ch = show.webChannel || show.network;
  if (!ch) return { channel: null, svc: null };
  const key = norm(ch.name);
  const home = HOME.get(key);
  if (home) return { channel: ch.name, svc: home, kind: show.webChannel ? "stream" : "home" };
  const later = LATER.get(key);
  const broadcast = BROADCAST.includes(ch.name);
  if (later) return { channel: ch.name, svc: later, kind: "later", broadcast };
  if (show.network && (ch.country?.code === "US")) return { channel: ch.name, svc: "livetv", kind: "cable", broadcast };

  }
  for (const s of SERVICES) {
    const k = norm(s.name);
    if (k.length >= 4 && n.startsWith(k)) return s.id;

/* ---------- My shows ---------- */

  if (isWatched(show.id)) watched = watched.filter(x => x.id !== show.id);

const watchBtn = (id, big) => { const w = isWatched(id); return big
  ? `<button class="btn ghost ${w ? "saved" : ""}" data-watch="${id}" aria-pressed="${w}">${w ? "✓ Watched" : "I've watched this"}</button>`

}

}

/* ---------- New episodes (schedule) ---------- */
const HIDE_TYPES = ["Talk Show", "News", "Sports"];
async function scheduleFor(date) {
  const [tv, web] = await Promise.all([
    tvm(`/schedule?country=${settings.country}&date=${date}`),
    tvm(`/schedule/web?date=${date}`)
  ]);
  const rows = [];
  (tv || []).forEach(ep => rows.push({ ep, show: ep.show, web: false }));
  (web || []).forEach(ep => {
    const show = ep._embedded?.show; if (!show) return;
    const wc = show.webChannel;
    const cc = wc?.country?.code;
    const known = wc && HOME.has(norm(wc.name));
    if ((cc && cc !== settings.country && !known) || (!known && show.language !== "English")) return;
    rows.push({ ep, show, web: true });
  });
  const byShow = new Map();
  for (const r of rows) {
    if (settings.hideTalk && HIDE_TYPES.includes(r.show.type)) continue;
    const k = r.show.id;
    if (byShow.has(k)) { byShow.get(k).count++; continue; }
    byShow.set(k, { ...r, count: 1 });
  }
  return [...byShow.values()];
}
function epLabel(ep, count) {
  if (count > 1) return `${count} new episodes · Season ${ep.season}`;
  if (ep.season === 1 && ep.number === 1) return "Series premiere";
  if (ep.number === 1) return `Season ${ep.season} premiere`;
  return `Season ${ep.season}, Episode ${ep.number ?? "special"}`;
}
async function renderTonight(arg) {

  const sel = arg && days.some(d => isoDay(d) === arg) ? arg : isoDay(days[0]);
  app.innerHTML = `
    <div class="page-head"><div><h1>New episodes</h1><p class="sub">What's coming out on TV and streaming each day this week.</p></div>
      <div class="head-checks"><label class="check"><input type="checkbox" id="hideTalk" ${settings.hideTalk ? "checked" : ""}> Hide news, talk and sports</label>${hideWatchedToggle()}</div></div>
    <div class="chips" role="group" aria-label="Pick a day">${days.map((d, i) => `<button class="chip" data-day="${isoDay(d)}" aria-pressed="${isoDay(d) === sel}">${i === 0 ? "Today" : i === 1 ? "Tomorrow" : d.toLocaleDateString(undefined, { weekday: "long" })} <small>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></button>`).join("")}</div>
    <div id="sched">${loading("Checking the TV schedule…")}</div>`;
  app.querySelectorAll("[data-day]").forEach(b => b.onclick = () => location.hash = "tonight/" + b.dataset.day);

    const tv = rows.filter(r => !r.web && !hideW(r.show)).sort((a, b) => (a.ep.airstamp || "").localeCompare(b.ep.airstamp || ""));
    const mine = rows.filter(r => inList(r.show.id));

      listShowCache.set(r.show.id, r.show);
      return `<a class="srow" href="#show/${r.show.id}">

async function findLastPage() {
  if (browse.lastPage != null) return browse.lastPage;
  let p = store.get("lastPage", 390);
  let data = await tvm(`/shows?page=${p}`);
  while (!data && p > 0) { p -= 3; data = await tvm(`/shows?page=${p}`); }
  while (await tvm(`/shows?page=${p + 1}`)) p++;
  store.set("lastPage", p);
  browse.lastPage = p; browse.nextHigh = p;

}
async function loadMorePages(n) {
  await findLastPage();

  for (let i = 0; i < n; i++) {
    if (i % 2 === 0 && browse.nextHigh >= browse.nextLow) want.push(browse.nextHigh--);
    else if (browse.nextLow <= browse.nextHigh) want.push(browse.nextLow++);
  }
  const got = await Promise.all(want.map(p => tvm(`/shows?page=${p}`)));
  want.forEach((p, i) => browse.pages.set(p, got[i] || []));
}

/* ---------- Trailers ---------- */
let ytApi = null;
function loadYouTubeApi() {
  if (ytApi) return ytApi;
  ytApi = new Promise((resolve, reject) => {
    if (window.YT?.Player) return resolve(window.YT);
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); resolve(window.YT); };
    const sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api";
    sc.onerror = () => { ytApi = null; reject(new Error("YouTube player didn't load")); };
    document.head.appendChild(sc);
    setTimeout(() => reject(new Error("YouTube player timed out")), 10000);
  });
  return ytApi;
}
async function trailerKeys(show) {
  const tid = await tmdbIdFor(show);
  if (!tid) return [];
  let vids = (await tmdb(`/tv/${tid}/videos?include_video_language=en,null`))?.results || [];
  if (!vids.some(v => v.site === "YouTube")) {
    const info = await tmdb(`/tv/${tid}`);
    const nums = (info?.seasons || []).map(x => x.season_number).filter(n => n > 0).reverse().slice(0, 3);
    for (const n of nums) vids = vids.concat((await tmdb(`/tv/${tid}/season/${n}/videos?include_video_language=en,null`))?.results || []);
  }
  const rank = v => (v.type === "Trailer" ? 0 : v.type === "Teaser" ? 1 : v.type === "Clip" ? 2 : 3) + (v.official ? 0 : 0.5);
  return [...new Set(vids.filter(v => v.site === "YouTube").sort((x, y) => rank(x) - rank(y)).map(v => v.key))];
}
async function playTrailer(show, slot, ytSearch) {
  const searchLink = `<a class="btn small" href="${ytSearch}" target="_blank" rel="noopener">Search YouTube for the trailer ↗</a>`;
  if (location.protocol === "file:") {
    slot.innerHTML = `<div class="note">YouTube won't play trailers inside Show Finder while it's opened as a file on this computer. Once Show Finder is on a website, trailers play right here.<div class="actions" style="margin:10px 0 0">${searchLink}</div></div>`;
    return;
  }
  slot.innerHTML = loading("Finding the trailer…");
  let keys = [];
  try { keys = await trailerKeys(show); } catch {}
  if (!keys.length) {
    slot.innerHTML = `<div class="note">No trailer is listed for ${esc(show.name)} yet.<div class="actions" style="margin:10px 0 0">${searchLink}</div></div>`;
    return;
  }
  const watchLink = k => `<a href="https://www.youtube.com/watch?v=${esc(k)}" target="_blank" rel="noopener">open it on YouTube</a>`;
  const hostId = "yt" + Math.random().toString(36).slice(2);
  slot.innerHTML = `<div class="trailer"><div id="${hostId}"></div></div><p class="meta ytnote">Trouble playing? You can also ${watchLink(keys[0])}.</p>`;
  let YT;
  try { YT = await loadYouTubeApi(); } catch {
    slot.querySelector(".trailer").innerHTML = `<iframe src="https://www.youtube.com/embed/${esc(keys[0])}?autoplay=1&rel=0&playsinline=1" title="${esc(show.name)} trailer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    return;
  }
  let i = 0;
  if (!slot.isConnected) return;
  const player = new YT.Player(hostId, {
    videoId: keys[0],
    playerVars: { autoplay: 1, rel: 0, playsinline: 1, origin: location.origin },
    events: {
      onError: () => {
        i++;
        if (i < keys.length) { player.loadVideoById(keys[i]); slot.querySelector(".ytnote").innerHTML = `Trouble playing? You can also ${watchLink(keys[i])}.`; }
        else slot.innerHTML = `<div class="note">YouTube won't let this trailer play outside its own site.<div class="actions" style="margin:10px 0 0"><a class="btn small" href="https://www.youtube.com/watch?v=${esc(keys[0])}" target="_blank" rel="noopener">Watch it on YouTube ↗</a></div></div>`;
      }
    }
  });
}

      if (seen.has(k)) return false; seen.add(k); return true;

    return items.length ? `<p style="margin:14px 0 6px"><b>${label}</b></p><div class="logos">${items.map(pv => {
      const id = priced ? matchProvider(pv.provider_name) : null;
      const name = id ? SVC[id].name : pv.provider_name;
      return `<span class="logo">${pv.logo_path ? `<img src="https://image.tmdb.org/t/p/w92${esc(pv.logo_path)}" alt="">` : ""}${esc(name)}${id ? ` <span class="price meta">${fromPrice(id) ? "from " + money(fromPrice(id)) + "/mo" : "Free"}</span>` : ""}${id && owns(id) ? ` <span class="have">✓ You have this</span>` : ""}</span>`;
    }).join("")}</div>` : "";
  };
  const free = [...(c.free || []), ...(c.ads || [])];
  const html = group(c.flatrate, "Streaming with a subscription", true) + group(free, "Free with ads", true) + group(c.buy, "Buy episodes or seasons", false);
  if (c.flatrate?.length || free.length) {
    const p = platformOf(show);
    box.querySelectorAll(":scope > .where-row, :scope > p").forEach(n => n.remove());
    if (p.channel) el().insertAdjacentHTML("beforebegin", `<p class="meta" style="margin:-4px 0 0">Originally ${show.webChannel ? "released on" : "aired on"} ${esc(p.channel)}.</p>`);
  }
  el().innerHTML = html || `<p class="meta" style="margin-top:12px">TMDB doesn't list any streaming services for this show right now.</p>`;
  if (c.flatrate?.length) {
    const id = c.flatrate.map(pv => matchProvider(pv.provider_name)).find(Boolean);
    const entry = myList.find(x => x.id === show.id);
    if (entry && id && entry.svc !== id) { entry.svc = id; saveList(); }

}
function seasonsHTML(seasons, eps) {
  if (!seasons.length) return `<p class="meta">No episode list yet.</p>`;
  const now = new Date().toISOString();
  return seasons.map((s, i) => {
    const se = eps.filter(e => e.season === s.number);
    const first = se[0]?.airdate || s.premiereDate, last = se[se.length - 1]?.airdate || s.endDate;
    const count = se.length || s.episodeOrder || 0;
    const range = first ? fmtDate(first) + (last && last !== first ? " – " + fmtDate(last) : "") : "Date not announced";
    const upcoming = se.some(e => e.airstamp && e.airstamp > now);
    return `<details class="season" ${i === seasons.length - 1 && seasons.length <= 3 ? "open" : ""}>
      <summary><b>Season ${s.number}</b><span>${count} episode${count === 1 ? "" : "s"}</span><span class="meta">${esc(range)}</span>${upcoming ? `<span class="pill live">New episodes coming</span>` : ""}</summary>
      <ol class="eps">${se.map(e => {
        const fut = e.airstamp && e.airstamp > now;
        const sum = stripHtml(e.summary);
        return `<li class="ep ${fut ? "future" : ""}"><span class="n">${e.number ?? "SP"}</span><span>${esc(e.name)}</span><span class="d">${e.airdate ? esc(fmtDate(e.airdate)) : "TBA"}</span>${sum ? `<span class="s">${esc(sum.length > 220 ? sum.slice(0, 217) + "…" : sum)}</span>` : ""}</li>`;
      }).join("") || `<li class="meta">Episode titles not announced yet.</li>`}</ol>
    </details>`;
  }).join("");
}
function downloadICS(show, ep) {
  const start = new Date(ep.airstamp);
  const end = new Date(start.getTime() + (ep.runtime || show.runtime || 60) * 60000);
  const f = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const where = platformOf(show).channel || "";
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Show Finder//EN", "BEGIN:VEVENT",
    `UID:sf-${show.id}-${ep.id}@showfinder`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(start)}`, `DTEND:${f(end)}`,
    `SUMMARY:${show.name} S${ep.season}E${ep.number ?? ""}`.replace(/[,;]/g, "\\$&"),
    `LOCATION:${where}`.replace(/[,;]/g, "\\$&"),
    "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY", "DESCRIPTION:Starting soon", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = show.name.replace(/[^\w ]+/g, "") + " next episode.ics";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Taste profile & recommendations ---------- */
const excluded = id => isWatched(id) || inList(id) || inMaybe(id) || isNope(id);
function likedEntries() {
  const m = new Map();
  [...watched, ...myList, ...maybe].forEach(x => { if (!m.has(x.id)) m.set(x.id, x); });
  return [...m.values()].sort((a, b) => (b.t || b.added || 0) - (a.t || a.added || 0));
}
const signalSig = () => [watched, myList, maybe, nope].map(a => a.map(x => x.id).join(".")).join("|") + "|" + (tmdbKey() ? 1 : 0);
async function metaFor(x) {
  if (x.genres) return x;
  const s = await tvm("/shows/" + x.id).catch(() => null);
  return s ? { ...brief(s), t: x.t || x.added } : x;
}
function tasteProfile(liked, disliked) {
  const g = {}, k = {}, l = {};
  liked.forEach(x => {
    (x.genres || []).forEach(v => g[v] = (g[v] || 0) + 1);
    if (x.type) k[x.type] = (k[x.type] || 0) + 1;
    if (x.lang) l[x.lang] = (l[x.lang] || 0) + 1;
  });
  disliked.forEach(x => (x.genres || []).forEach(v => g[v] = (g[v] || 0) - 0.5));
  return { g, k, l, n: Math.max(1, liked.length) };
}
function tasteScore(show, prof) {
  let sc = 0;
  (show.genres || []).forEach(v => sc += (prof.g[v] || 0) / prof.n);
  sc += ((prof.k[show.type] || 0) / prof.n) * 0.8;
  if (Object.keys(prof.l).length) sc += prof.l[show.language] ? 0.4 : -1.5;
  return sc;
}
const topGenres = (show, prof) => (show.genres || []).filter(g => (prof.g[g] || 0) > 0).sort((a, b) => prof.g[b] - prof.g[a]).slice(0, 2);
async function tvmFromTmdb(tid, name) {
  const ex = await tmdb(`/tv/${tid}/external_ids`);
  let s = null;
  if (ex?.tvdb_id) s = await tvm(`/lookup/shows?thetvdb=${ex.tvdb_id}`).catch(() => null);
  if (!s && ex?.imdb_id) s = await tvm(`/lookup/shows?imdb=${ex.imdb_id}`).catch(() => null);
  if (!s) s = await tvm(`/singlesearch/shows?q=${encodeURIComponent(name)}`).catch(() => null);
  return s;
}
let recsCache = null;
async function computeRecs(progress) {
  const sig = signalSig();
  if (recsCache?.sig === sig) return recsCache.items;
  const liked = await Promise.all(likedEntries().map(metaFor));
  const prof = tasteProfile(liked, nope);
  const cands = new Map();
  const add = (show, pts, because) => {
    if (!show || excluded(show.id)) return;
    const c = cands.get(show.id) || { show, pts: 0, because: new Set() };
    c.pts += pts;
    (because || []).forEach(b => c.because.add(b));
    cands.set(show.id, c);
  };
  // 1. "People who liked this also liked" from TMDB
  if (tmdbKey()) {
    const tmdbC = new Map();
    for (const seed of liked.slice(0, 10)) {
      progress?.(`Looking at shows like ${seed.name}…`);
      const full = await tvm("/shows/" + seed.id).catch(() => null);
      const tid = full && await tmdbIdFor(full);
      if (!tid) continue;
      const r = await tmdb(`/tv/${tid}/recommendations`);
      (r?.results || []).forEach((x, rank) => {
        const c = tmdbC.get(x.id) || { x, pts: 0, because: new Set() };
        c.pts += 1 + (20 - rank) / 40;
        c.because.add(seed.name);
        tmdbC.set(x.id, c);
      });
    }
    const wantEn = (prof.l.English || 0) >= prof.n / 2;
    const top = [...tmdbC.values()]
      .filter(c => !wantEn || c.x.original_language === "en")
      .sort((a, b) => (b.pts + (b.x.vote_average || 0) / 20) - (a.pts + (a.x.vote_average || 0) / 20))
      .slice(0, 30);
    progress?.("Matching picks to the show guide…");
    for (let i = 0; i < top.length; i += 5) {
      const batch = await Promise.all(top.slice(i, i + 5).map(c => tvmFromTmdb(c.x.id, c.x.name).then(s => [c, s])));
      batch.forEach(([c, s]) => add(s, c.pts * 1.6, [...c.because]));
    }
  }
  // 2. Popular shows that match the taste profile
  progress?.("Checking popular shows against your taste…");
  if (!browse.pages.size) await loadMorePages(6);
  allLoaded()
    .filter(s => s.image && (s.weight || 0) >= 60 && !excluded(s.id))
    .map(s => [s, tasteScore(s, prof)])
    .filter(([, t]) => t > 0.9)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 40)
    .forEach(([s]) => add(s, 0.3, null));
  const items = [...cands.values()].map(c => {
    const t = tasteScore(c.show, prof);
    const score = c.pts + t * 1.5 + (c.show.rating?.average || 6) / 10 + (c.show.weight || 0) / 100;
    const b = [...c.because];
    const tg = topGenres(c.show, prof);
    const why = b.length ? `Because you liked ${b.slice(0, 2).join(" and ")}${b.length > 2 ? ` and ${b.length - 2} more` : ""}`
      : tg.length ? `You like ${tg.map(g => g.replace("-", " ")).join(" and ")} shows` : "Popular with people like you";
    return { show: c.show, score, why, t };
  }).filter(x => x.t > -0.5).sort((a, b) => b.score - a.score).slice(0, 48);
  recsCache = { sig, items };
  return items;
}
async function renderForYou() {
  const tok = renderToken;
  const liked = likedEntries();
  app.innerHTML = `<div class="page-head"><div><h1>For you</h1><p class="sub">Picks based on the shows you've watched, saved, or liked in Swipe.</p></div>
    ${liked.length ? `<button class="btn ghost small" id="refreshRecs">Refresh picks</button>` : ""}</div><div id="recs"></div>`;
  const out = document.getElementById("recs");
  if (!liked.length) {
    out.innerHTML = `<div class="empty">Show Finder doesn't know your taste yet. Mark a few shows as watched, add some to My shows, or rate shows in Swipe, and picks will show up here.
      <div class="actions"><a class="btn" href="#swipe">Start swiping</a><a class="btn ghost" href="#browse">Browse shows</a></div></div>`;
    return;
  }
  app.querySelector("#refreshRecs").onclick = () => { recsCache = null; renderForYou(); };
  out.innerHTML = `<div class="loading"><span class="spin"></span><span id="recMsg">Finding shows you'll like…</span></div>`;
  try {
    const items = await computeRecs(msg => { const m = document.getElementById("recMsg"); if (m && tok === renderToken) m.textContent = msg; });
    if (tok !== renderToken) return;
    const few = liked.length < 4 ? `<div class="note" style="margin-bottom:18px">Picks get better once Show Finder knows 4 or 5 shows you like. <a href="#swipe">Swipe through a few more</a>.</div>` : "";
    out.innerHTML = few + (items.length
      ? `<div class="grid">${items.map(r => card(r.show, null, `<div class="why">${esc(r.why)}</div>`)).join("")}</div>`
      : `<div class="empty">No picks yet. Try marking a few more shows you've enjoyed.</div>`) +
      `<p class="meta center" style="margin-top:24px">Not quite right? Every swipe in <a href="#swipe">Swipe</a> teaches Show Finder more.</p>`;
  } catch (err) { if (tok === renderToken) out.innerHTML = errorBox(err); }
}

/* ---------- Swipe ---------- */
const swipe = { deck: [], idx: 0, history: [] };
const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
async function buildDeck() {
  if (!browse.pages.size) await loadMorePages(6);
  const langs = new Set(["English", ...likedEntries().map(x => x.lang).filter(Boolean)]);
  const pool = allLoaded().filter(s => s.image && s.summary && (s.weight || 0) >= 70 && langs.has(s.language) && !excluded(s.id));
  // Random order, nudged toward the viewer's taste once there is one
  const liked = likedEntries();
  const prof = liked.length ? tasteProfile(await Promise.all(liked.map(metaFor)), nope) : null;
  const key = new Map(pool.map(s => [s.id, Math.random() + (prof ? Math.max(-0.5, tasteScore(s, prof)) * 0.4 : 0)]));
  pool.sort((a, b) => key.get(b.id) - key.get(a.id));
  const recs = (recsCache?.items || []).map(r => r.show).filter(s => s.image && !excluded(s.id));
  const deck = [], seen = new Set();
  let ri = 0;
  for (let i = 0; i < pool.length; i++) {
    if (i % 3 === 2 && ri < recs.length) { const r = recs[ri++]; if (!seen.has(r.id)) { seen.add(r.id); deck.push(r); } }
    if (!seen.has(pool[i].id)) { seen.add(pool[i].id); deck.push(pool[i]); }
  }
  swipe.deck = deck;
  swipe.idx = 0;
}
async function renderSwipe() {
  const tok = renderToken;
  app.innerHTML = `<div class="page-head"><div><h1>Swipe</h1><p class="sub">Swipe right if a show looks good, left if it doesn't. Shows you like go to your Maybe list, and every swipe sharpens your For you picks.</p></div>
    <div class="meta" id="swipeStats"></div></div>
    <div class="deck" id="deck">${loading("Shuffling shows…")}</div>
    <div class="swipe-actions">
      <button class="sbtn no" data-swipe="no"><b>✕</b>Not for me</button>
      <button class="sbtn seen" data-swipe="seen"><b>✓</b>Seen it</button>
      <button class="sbtn yes" data-swipe="yes"><b>♥</b>Interested</button>
    </div>
    <div class="actions center" style="margin-top:14px"><button class="linkbtn" id="undoSwipe" hidden>Undo last swipe</button></div>
    <p class="meta center">On a keyboard: ← not for me, ↓ seen it, → interested.</p>`;
  app.querySelectorAll("[data-swipe]").forEach(b => b.onclick = () => commitSwipe(b.dataset.swipe));
  app.querySelector("#undoSwipe").onclick = undoSwipe;
  try {
    swipe.deck = swipe.deck.filter((s, i) => i < swipe.idx || !excluded(s.id));
    if (swipe.idx >= swipe.deck.length) await buildDeck();
    if (tok !== renderToken) return;
    drawSwipe();
  } catch (err) { if (tok === renderToken) document.getElementById("deck").innerHTML = errorBox(err); }
}
function swipeStats() {
  const el = document.getElementById("swipeStats");
  if (el) el.innerHTML = `${maybe.length} in <a href="#mylist">Maybe</a> · ${nope.length} passed on`;
  const u = document.getElementById("undoSwipe");
  if (u) u.hidden = !swipe.history.length;
}
function drawSwipe() {
  const deckEl = document.getElementById("deck");
  if (!deckEl) return;
  swipeStats();
  const show = swipe.deck[swipe.idx];
  app.querySelectorAll("[data-swipe]").forEach(b => b.disabled = !show);
  if (!show) {
    const more = browse.nextLow <= browse.nextHigh;
    deckEl.innerHTML = `<div class="empty center">You've been through this whole batch.<div class="actions center">${more ? `<button class="btn" id="moreSwipe">Load more shows</button>` : ""}<a class="btn ghost" href="#foryou">See For you picks</a></div></div>`;
    const m = document.getElementById("moreSwipe");
    if (m) m.onclick = async () => { m.disabled = true; m.textContent = "Loading…"; await loadMorePages(4); await buildDeck(); drawSwipe(); };
    return;
  }
  listShowCache.set(show.id, show);
  const sum = stripHtml(show.summary);
  deckEl.innerHTML = `<div class="swipe-card" id="scard">
    <span class="stamp yes">YES</span><span class="stamp no">NOPE</span>
    <div class="pimg">${show.image ? `<img src="${esc(show.image.original || show.image.medium)}" alt="" draggable="false">` : esc(show.name)}</div>
    <div class="sinfo">
      <h2>${esc(show.name)}</h2>
      <div class="facts">${statusPill(show)}<span>${esc(years(show))}</span>${show.rating?.average ? `<span>★ ${show.rating.average}</span>` : ""}</div>
      <div class="meta">${esc(show.genres.join(", "))}</div>
      <div>${svcChip(show)}</div>
      <p class="sclamp">${esc(sum)}</p>
      <div><button class="linkbtn" data-quick="${show.id}">See details and trailer</button></div>
    </div>
  </div>`;
  const next = swipe.deck[swipe.idx + 1];
  if (next?.image) { const im = new Image(); im.src = next.image.original || next.image.medium; }
  bindDrag(document.getElementById("scard"));
}
function bindDrag(el) {
  let x0 = null, dx = 0;
  const yes = el.querySelector(".stamp.yes"), no = el.querySelector(".stamp.no");
  el.addEventListener("pointerdown", e => {
    if (e.target.closest("button, a")) return;
    x0 = e.clientX; dx = 0;
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
  });
  el.addEventListener("pointermove", e => {
    if (x0 == null) return;
    dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 100));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  const end = () => {
    if (x0 == null) return;
    x0 = null;
    el.classList.remove("dragging");
    if (dx > 110) commitSwipe("yes");
    else if (dx < -110) commitSwipe("no");
    else { el.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}
function commitSwipe(kind) {
  const show = swipe.deck[swipe.idx];
  if (!show) return;
  const b = brief(show);
  if (kind === "yes" && !inMaybe(show.id)) maybe.unshift(b);
  if (kind === "no" && !isNope(show.id)) nope.unshift(b);
  if (kind === "seen" && !isWatched(show.id)) watched.unshift(b);
  saveSignals();
  swipe.history.push({ id: show.id, kind });
  swipe.idx++;
  const el = document.getElementById("scard");
  if (el && !reduceMotion()) {
    el.style.transform = kind === "yes" ? "translateX(130%) rotate(18deg)" : kind === "no" ? "translateX(-130%) rotate(-18deg)" : "translateY(30%) scale(.9)";
    el.style.opacity = 0;
    setTimeout(drawSwipe, 200);
  } else drawSwipe();
}
function undoSwipe() {
  const last = swipe.history.pop();
  if (!last) return;
  if (last.kind === "yes") maybe = maybe.filter(x => x.id !== last.id);
  if (last.kind === "no") nope = nope.filter(x => x.id !== last.id);
  if (last.kind === "seen") watched = watched.filter(x => x.id !== last.id);
  saveSignals();
  swipe.idx = Math.max(0, swipe.idx - 1);
  drawSwipe();
}
document.addEventListener("keydown", e => {
  if (currentTab() !== "swipe" || quick.open || e.target.closest?.("input, select, textarea, button, a")) return;
  const k = { ArrowRight: "yes", ArrowLeft: "no", ArrowDown: "seen" }[e.key];
  if (k) { e.preventDefault(); commitSwipe(k); }
});

applyLook();
saveList();
route();
</script>
