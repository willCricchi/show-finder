name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with TMDB key
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          mkdir _site
          python3 - <<'PY'
          import os
          key = os.environ.get("TMDB_KEY", "").strip()
          html = open("index.html").read().replace("__TMDB_KEY__", key)
          open("_site/index.html", "w").write(html)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
